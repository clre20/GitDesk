name: Build installers

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: pwsh
        run: .\packaging\windows\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GitDesk-windows
          path: |
            dist/GitDesk-Setup-*.exe
            dist/*-portable.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon-x11-0
      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash packaging/linux/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GitDesk-linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  release:
    if: github.event_name == 'release'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/*/*
